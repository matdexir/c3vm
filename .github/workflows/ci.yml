name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: true

      - name: Build
        run: go build -o c3vm .

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./... -v

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: c3vm-${{ matrix.os }}
          path: c3vm

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: c3vm-*
          path: artifacts

      - name: Prepare release files
        run: |
          mkdir -p dist
          cp artifacts/c3vm-ubuntu-latest/c3vm dist/c3vm-linux-x86_64
          cp artifacts/c3vm-macos-latest/c3vm  dist/c3vm-darwin-x86_64
          chmod +x dist/*

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
